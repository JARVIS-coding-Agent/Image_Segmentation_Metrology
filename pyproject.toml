[project]
name = "animal-eye-metrology"
version = "0.1.0"
description = "COCO 動物分割 + 眼睛定位 + 雙眼/兩動物右眼距離量測 pipeline"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src.metrology", "src.evaluate"]

[tool.coverage.report]
# constitution II: metrology 與 evaluate 覆蓋率 >= 80%
fail_under = 80
show_missing = true
