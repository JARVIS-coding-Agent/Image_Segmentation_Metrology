name: tests

on:
  push:
    branches: [main, "fix/**", "feat/**", "docs/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 單元測試為純 numpy 設計；整合測試會經 pipeline→visualize 載入 matplotlib。
      # 重依賴（ultralytics/opencv/pycocotools）以 lazy import 隔離，未安裝也能跑；
      # 此處裝測試實際會 import 到的輕量依賴。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4" "pydantic==2.9.2" "matplotlib==3.9.2" "pytest==8.3.3" "pytest-cov==5.0.0"

      - name: Run tests
        run: pytest -v
